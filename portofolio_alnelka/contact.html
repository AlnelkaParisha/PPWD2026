<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact - Portofolio Saya</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigasi -->
    <nav>
        <div class="container">

            <div class="logo">
                MyPortofolio
            </div>

            <ul class="nav-links">

                <li>
                    <a href="index.html">
                        Home
                    </a>
                </li>

                <li>
                    <a href="about.html">
                        About
                    </a>
                </li>

                <li>
                    <a href="contact.html" class="active">
                        Contact
                    </a>
                </li>

            </ul>

        </div>
    </nav>


    <!-- Contact Section -->
    <section class="page-section">

        <div class="container">

            <h1>Contact Me</h1>

            <p style="text-align: center; margin-bottom: 30px;">
                Silakan isi form berikut jika ingin menghubungi saya.
            </p>

            <form
                id="contact-form"
                class="contact-form"
            >

                <div class="form-group">

                    <label for="name">
                        Nama
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Masukkan nama Anda"
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Masukkan email Anda"
                    >

                </div>


                <div class="form-group">

                    <label for="message">
                        Pesan
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        placeholder="Tulis pesan Anda"
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="btn"
                >
                    Kirim Pesan
                </button>

            </form>

        </div>

    </section>


    <!-- Footer -->
    <footer>
        <p>&copy; 2026 MyPortofolio</p>
    </footer>


    <script src="js/main.js"></script>

</body>
</html>
